<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M I C O AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen max-w-lg mx-auto">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-3">
            <img src="icon.png" alt="Logo" class="w-10 h-10 rounded-xl object-cover border border-slate-700">
            <div>
                <h1 class="font-bold text-lg tracking-wide">M I C O AI</h1>
                <p class="text-xs text-emerald-400 font-medium">Online & Ready</p>
            </div>
        </div>
    </header>

    <!-- Chat Box -->
    <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4">
        <div class="flex justify-start">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 max-w-[80%] text-sm text-slate-300 shadow">
                What's up! I'm M I C O AI. How can I help you crush it today?
            </div>
        </div>
    </div>

    <!-- Input Bar -->
    <div class="bg-slate-900 border-t border-slate-800 p-3 flex items-center gap-2">
        <input type="text" id="user-input" placeholder="Ask M I C O AI anything..." 
            class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 text-slate-100">
        <button onclick="sendMessage()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-3 rounded-xl font-bold text-sm shadow transition">
            Send
        </button>
    </div>

    <script>
                const API_KEY = "AQ.Ab8RN6IGGjLMOO1EjZZwf_GgeTp3oBwg0hSgCFpxsAaeHp91Mw";

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatContainer = document.getElementById('chat-container');
            const text = inputField.value.trim();
            if (!text) return;

            // Append User Message
            chatContainer.innerHTML += `
                <div class="flex justify-end">
                    <div class="bg-emerald-600 text-white rounded-2xl p-3 max-w-[80%] text-sm shadow">
                        ${escapeHtml(text)}
                    </div>
                </div>`;
            
            inputField.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Loading bubble
            const loadingId = 'loading-' + Date.now();
            chatContainer.innerHTML += `
                <div id="${loadingId}" class="flex justify-start">
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 text-sm text-slate-400 shadow animate-pulse">
                        Thinking...
                    </div>
                </div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (!response.ok) {
                    throw new Error(data.error?.message || `HTTP error! status: ${response.status}`);
                }

                const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "No response received.";

                // Append AI Response
                chatContainer.innerHTML += `
                    <div class="flex justify-start">
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 max-w-[80%] text-sm text-slate-200 shadow">
                            ${escapeHtml(reply)}
                        </div>
                    </div>`;
            } catch (err) {
                document.getElementById(loadingId).remove();
                chatContainer.innerHTML += `
                    <div class="flex justify-start">
                        <div class="bg-red-950 border border-red-800 text-red-200 rounded-2xl p-3 max-w-[80%] text-sm shadow">
                            Error: ${escapeHtml(err.message)}
                        </div>
                    </div>`;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        
        });
    </script>
</body>
</html>
