<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M I C O AI</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.png">
    <meta name="theme-color" content="#020617">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        pre { background: #090d16; padding: 12px; border-radius: 8px; overflow-x: auto; margin-top: 8px; margin-bottom: 8px; border: 1px solid #1e293b; }
        code { font-family: monospace; color: #34d399; font-size: 13px; }
        p { margin-bottom: 6px; }
        p:last-child { margin-bottom: 0; }
        ul, ol { margin-left: 16px; margin-bottom: 6px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] flex flex-col justify-between overflow-hidden">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-3 flex items-center justify-between shadow-md shrink-0">
        <div class="flex items-center space-x-3">
            <img src="icon.png" alt="Logo" class="w-9 h-9 rounded-xl object-cover border border-slate-700 shadow">
            <div>
                <h1 class="font-bold text-sm tracking-wide text-emerald-400">M I C O A I</h1>
                <p class="text-[10px] text-slate-400">Omni Edition • Online</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="clearHistory()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-2.5 py-1.5 rounded-lg border border-slate-700 transition">Clear</button>
            <button id="install-btn" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3 py-1.5 rounded-lg shadow transition">Install</button>
        </div>
    </header>

    <!-- Chat Container -->
    <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 text-sm">
        <!-- Messages populate here -->
    </div>

    <!-- File Preview Bar -->
    <div id="preview-container" class="hidden px-4 py-2 bg-slate-900 border-t border-slate-800 flex items-center space-x-2 shrink-0">
        <div id="preview-icon" class="text-xs font-bold bg-emerald-950 text-emerald-400 px-2 py-1 rounded border border-emerald-800">FILE</div>
        <span id="preview-name" class="text-xs text-slate-300 truncate flex-1">Attached file</span>
        <button onclick="clearFile()" class="text-red-400 text-xs font-bold px-2 py-1">Remove</button>
    </div>

    <!-- Input Bar -->
    <div class="bg-slate-900 border-t border-slate-800 p-3 flex items-center space-x-2 shrink-0">
        <input type="file" id="file-input" accept="image/*,application/pdf,text/plain" class="hidden" onchange="handleFileSelect(event)">
        <button onclick="document.getElementById('file-input').click()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 p-2.5 rounded-xl border border-slate-700 transition flex items-center justify-center shrink-0">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
        </button>
        <input type="text" id="user-input" placeholder="Ask M I C O AI anything or send PDF..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500 text-slate-100 placeholder-slate-500">
        <button onclick="sendMessage()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-4 py-2.5 rounded-xl text-sm transition shadow shrink-0">Send</button>
    </div>

    <script>
        const API_KEY = "AQ.Ab8RN6IGGjLMOO1EjZZwf_GgeTp3oBwg0hSgCFpxsAaeHp91Mw";
        let selectedBase64Data = null;
        let selectedMimeType = null;
        let selectedFileName = null;
        let chatHistory = JSON.parse(localStorage.getItem('mico_ai_history')) || [];

        // PWA Install Prompt Handler
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
        });
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') installBtn.classList.add('hidden');
                deferredPrompt = null;
            }
        });

        function renderChat() {
            const container = document.getElementById('chat-container');
            if (chatHistory.length === 0) {
                container.innerHTML = `
                    <div class="flex justify-start">
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 max-w-[85%] text-sm text-slate-200 shadow">
                            What's up! I'm M I C O AI. Keyboard is locked and loaded. Send texts, images, or PDFs and let's crush it today!
                        </div>
                    </div>`;
                return;
            }
            
            container.innerHTML = '';
            chatHistory.forEach((msg, index) => {
                if (msg.role === 'user') {
                    let fileDisplay = '';
                    if (msg.fileData) {
                        if (msg.mimeType && msg.mimeType.startsWith('image/')) {
                            fileDisplay = `<div class="mb-2"><img src="${msg.fileData}" class="rounded-lg max-h-32 object-cover border border-emerald-500/30"></div>`;
                        } else {
                            fileDisplay = `<div class="mb-2 text-xs font-semibold bg-black/30 px-2 py-1 rounded text-emerald-300">📄 ${msg.fileName || 'Attached Document'}</div>`;
                        }
                    }
                    container.innerHTML += `
                        <div class="flex justify-end">
                            <div class="bg-emerald-600 text-white rounded-2xl p-3 max-w-[85%] text-sm shadow">
                                ${fileDisplay}
                                ${escapeHtml(msg.text)}
                            </div>
                        </div>`;
                } else {
                    // Unique ID for text-to-speech button
                    const safeText = msg.text.replace(/"/g, '&quot;');
                    container.innerHTML += `
                        <div class="flex justify-start">
                            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 max-w-[85%] text-sm text-slate-200 shadow relative group">
                                ${marked.parse(msg.text)}
                                <button onclick="speakResponse(this)" data-text="${safeText}" class="mt-2 text-[10px] bg-slate-800 hover:bg-slate-700 text-emerald-400 px-2 py-1 rounded border border-slate-700 flex items-center space-x-1 transition">
                                    <span>🔊 Read Aloud</span>
                                </button>
                            </div>
                        </div>`;
                }
            });
            container.scrollTop = container.scrollHeight;
        }

        function speakResponse(btn) {
            const textToSpeak = btn.getAttribute('data-text');
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop any ongoing speech
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Speech synthesis not supported on this browser.");
            }
        }

        function clearHistory() {
            if (confirm("Clear chat history?")) {
                chatHistory = [];
                localStorage.removeItem('mico_ai_history');
                renderChat();
            }
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            selectedMimeType = file.type;
            selectedFileName = file.name;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                selectedBase64Data = e.target.result.split(',')[1];
                document.getElementById('preview-name').textContent = selectedFileName;
                document.getElementById('preview-container').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function clearFile() {
            selectedBase64Data = null;
            selectedMimeType = null;
            selectedFileName = null;
            document.getElementById('file-input').value = '';
            document.getElementById('preview-container').classList.add('hidden');
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatContainer = document.getElementById('chat-container');
            const text = inputField.value.trim();
            if (!text && !selectedBase64Data) return;

            let currentData = selectedBase64Data;
            let currentMime = selectedMimeType;
            let currentName = selectedFileName;
            let dataUrlForStorage = currentData ? `data:${currentMime};base64,${currentData}` : null;

            chatHistory.push({ role: 'user', text: text, fileData: dataUrlForStorage, mimeType: currentMime, fileName: currentName });
            localStorage.setItem('mico_ai_history', JSON.stringify(chatHistory));
            
            inputField.value = '';
            clearFile();
            renderChat();

            const loadingId = 'loading-' + Date.now();
            chatContainer.innerHTML += `
                <div id="${loadingId}" class="flex justify-start">
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 text-sm text-slate-400 shadow animate-pulse">
                        Thinking...
                    </div>
                </div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Build API contents structure
            let contents = chatHistory.slice(-8).map(item => {
                let parts = [];
                if (item.fileData) {
                    parts.push({
                        inline_data: {
                            mime_type: item.mimeType || "application/pdf",
                            data: item.fileData.split(',')[1]
                        }
                    });
                }
                parts.push({ text: item.text || "Analyze this file" });
                return {
                    role: item.role === 'user' ? 'user' : 'model',
                    parts: parts
                };
            });

            // Adjust the last message format if model responded previously
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: {
                            parts: [{ text: "You are M I C O AI, an elite, high-performance AI assistant created for M I C O. Be sharp, direct, highly capable in coding, gaming, university physics/biology, and markdown formatting." }]
                        },
                        contents: contents
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (!response.ok) {
                    throw new Error(data.error?.message || `HTTP error! status: ${response.status}`);
                }

                const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "No response received.";

                chatHistory.push({ role: 'model', text: reply });
                localStorage.setItem('mico_ai_history', JSON.stringify(chatHistory));
                renderChat();

            } catch (err) {
                document.getElementById(loadingId).remove();
                chatContainer.innerHTML += `
                    <div class="flex justify-start">
                        <div class="bg-red-950 border border-red-800 text-red-200 rounded-2xl p-3 max-w-[85%] text-sm shadow">
                            Error: ${escapeHtml(err.message)}
                        </div>
                    </div>`;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });

        renderChat();
    </script>
</body>
</html>
